<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Level & Tilemap Designer</title>
    <style>
      body {
        margin: 0;
        background: #0e0e11;
        color: #f4f4f5;
        font-family: sans-serif;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      #sidebar {
        width: 280px;
        border-right: 1px solid #2a2a32;
        background: #18181c;
        padding: 12px;
      }
      #viewport {
        flex: 1;
        position: relative;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <h3>Level Designer</h3>
      <layers-manager id="layerManager"></layers-manager>
    </div>
    <div id="viewport">
      <canvas id="levelCanvas"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
